    <meta property="og:type" content="website" />

    <meta property="og:title" content="Rafael Naves · Engenheiro de IA e Dados" />
    <meta
      property="og:description"
      content="Dois projetos de IA em produção numa montadora: estudos de 2–3 meses em 30 minutos e indicadores de 6–7 horas em 5 minutos."

    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rafael Naves",
        "jobTitle": "Engenheiro de IA e Dados",
        "url": "https://rafnaves.github.io",
        "address": { "@type": "PostalAddress", "addressLocality": "Catalão", "addressRegion": "GO", "addressCountry": "BR" },
        "alumniOf": "Universidade Federal de Catalão (UFCAT)",
        "sameAs": ["https://www.linkedin.com/in/rafael-naves-ai", "https://github.com/rafnaves"]
      }
    </script>

    <!-- Fonts load without blocking the first paint; text shows in the fallback font meanwhile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Applies the saved or system theme before the first paint (see src/hooks/useTheme.ts). -->
    <script>
      (function () {
        var dark;
        try {
          var saved = localStorage.getItem("theme");
          dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {
          dark = matchMedia("(prefers-color-scheme: dark)").matches;
        }
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
